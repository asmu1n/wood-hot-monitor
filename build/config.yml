version: "3"

info:
  companyName: "asmu1n"
  productName: "Wood Hot Monitor"
  productIdentifier: "com.asmu1n.woodhotmonitor"
  description: "AI-driven multi-source hotspot monitoring"
  copyright: "(c) 2025, asmu1n"
  comments: "AI-driven multi-source hotspot monitoring"
  version: "0.2.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
