version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Linux application
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o "{{.BIN_DIR}}/{{.APP_NAME}}"
    env:
      GOOS: linux
      CGO_ENABLED: 1

  package:
    summary: Packages the Linux application
    deps:
      - task: build

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
