name: Package Wails app
description: Build/package the app for the current runner OS and stage artifacts under dist/.

inputs:
  app-name:
    required: true
  goos:
    description: Target GOOS label used only for packaging branch (darwin|linux|windows)
    required: true
  artifact-base:
    description: Filename prefix for staged artifacts (no extension)
    required: true
  app-version:
    required: true
  git-commit:
    required: true
  build-time:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Package
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        APP_VERSION: ${{ inputs.app-version }}
        GIT_COMMIT: ${{ inputs.git-commit }}
        BUILD_TIME: ${{ inputs.build-time }}
      run: |
        set -euo pipefail
        mkdir -p dist bin
        if [[ -z "${BUILD_TIME}" ]]; then
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIME
        fi

        ARTIFACT_BASE='${{ inputs.artifact-base }}'
        GOOS_NAME='${{ inputs.goos }}'

        echo "package ${APP_NAME} goos=${GOOS_NAME}"
        echo "  APP_VERSION=${APP_VERSION}"
        echo "  GIT_COMMIT=${GIT_COMMIT}"
        echo "  BUILD_TIME=${BUILD_TIME}"

        # Windows: ensure makensis is on PATH for this step AND for go-task child processes.
        # GITHUB_PATH alone is not always enough when task resolves executables.
        if [[ "${GOOS_NAME}" == "windows" || "${RUNNER_OS:-}" == "Windows" ]]; then
          for d in \
            "/c/Program Files (x86)/NSIS" \
            "/c/Program Files/NSIS" \
            "/c/ProgramData/chocolatey/bin"
          do
            if [[ -x "${d}/makensis.exe" || -f "${d}/makensis.exe" ]]; then
              export PATH="${d}:${PATH}"
              # Also expose a no-extension shim name some resolvers look for.
              if [[ ! -e "${d}/makensis" && -f "${d}/makensis.exe" ]]; then
                # Git Bash can run .exe via bare name if dir is on PATH; keep dir first.
                true
              fi
              echo "Using NSIS from: ${d}"
            fi
          done
          if ! command -v makensis >/dev/null 2>&1 && ! command -v makensis.exe >/dev/null 2>&1; then
            echo "makensis not found after PATH fix" >&2
            echo "PATH=${PATH}" >&2
            ls -la "/c/Program Files (x86)/NSIS" 2>&1 || true
            ls -la "/c/ProgramData/chocolatey/bin" 2>&1 || true
            exit 1
          fi
          command -v makensis || command -v makensis.exe
          makensis -VERSION || makensis.exe -VERSION
        fi

        case "${GOOS_NAME}" in
          darwin)
            wails3 task package
            test -d "bin/${APP_NAME}.app"
            (cd bin && ditto -c -k --keepParent "${APP_NAME}.app" "../dist/${ARTIFACT_BASE}.app.zip")
            ;;
          linux)
            wails3 task build
            test -x "bin/${APP_NAME}"
            wails3 task linux:generate:dotdesktop
            wails3 task linux:generate:deb
            tar -C bin -czf "dist/${ARTIFACT_BASE}.tar.gz" "${APP_NAME}"
            shopt -s nullglob
            deb_files=(bin/*.deb)
            if ((${#deb_files[@]} == 0)); then
              echo "expected .deb under bin/" >&2
              ls -la bin >&2 || true
              exit 1
            fi
            cp "${deb_files[0]}" "dist/${ARTIFACT_BASE}.deb"
            ;;
          windows)
            # Resolve absolute makensis path — go-task LookPath is unreliable on Windows CI.
            MAKENSIS_BIN=""
            for candidate in               "/c/Program Files (x86)/NSIS/makensis.exe"               "/c/Program Files/NSIS/makensis.exe"               "/c/ProgramData/chocolatey/bin/makensis.exe"
            do
              if [[ -f "$candidate" ]]; then
                MAKENSIS_BIN="$candidate"
                break
              fi
            done
            if [[ -z "$MAKENSIS_BIN" ]]; then
              MAKENSIS_BIN="$(command -v makensis.exe 2>/dev/null || command -v makensis 2>/dev/null || true)"
            fi
            if [[ -z "$MAKENSIS_BIN" ]]; then
              echo "makensis.exe not found" >&2
              exit 1
            fi
            # Convert /c/foo -> C:/foo for Task on Windows (spaces-safe, no backslash escapes).
            if command -v cygpath >/dev/null 2>&1; then
              MAKENSIS_WIN="$(cygpath -m "$MAKENSIS_BIN")"
            elif [[ "$MAKENSIS_BIN" == /c/* ]]; then
              MAKENSIS_WIN="C:/${MAKENSIS_BIN#/c/}"
            else
              MAKENSIS_WIN="$MAKENSIS_BIN"
            fi
            echo "MAKENSIS=${MAKENSIS_WIN}"
            wails3 task package "MAKENSIS=${MAKENSIS_WIN}"
            test -f "bin/${APP_NAME}.exe"
            shopt -s nullglob
            installer_files=(bin/*installer*.exe)
            if ((${#installer_files[@]} == 0)); then
              echo "expected NSIS installer under bin/" >&2
              ls -la bin build/windows/nsis >&2 || true
              exit 1
            fi
            cp "${installer_files[0]}" "dist/${ARTIFACT_BASE}-installer.exe"
            (cd bin && zip -9 "../dist/${ARTIFACT_BASE}.zip" "${APP_NAME}.exe")
            ;;
          *)
            echo "unsupported goos: ${GOOS_NAME}" >&2
            exit 1
            ;;
        esac

        {
          echo "name=${APP_NAME}"
          echo "version=${APP_VERSION}"
          echo "git_commit=${GIT_COMMIT}"
          echo "goos=${GOOS_NAME}"
          echo "built_at=${BUILD_TIME}"
        } > "dist/${ARTIFACT_BASE}.txt"

        ls -lah dist
