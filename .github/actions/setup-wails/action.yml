name: Setup Wails build
description: Install Go, Bun, Task, Wails CLI, platform native deps, and frontend modules.

inputs:
  wails-version:
    description: Wails CLI module version (e.g. v3.0.0-alpha2.110)
    required: true
  bun-version:
    description: Bun version
    required: false
    default: "1.3.11"
  install-frontend:
    description: Run bun install in frontend/
    required: false
    default: "true"
  install-nsis:
    description: Install NSIS on Windows runners
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    - name: Install Wails CLI
      shell: bash
      env:
        # Avoid pulling GTK/WebKit just to compile the CLI on Linux.
        CGO_ENABLED: "0"
      run: |
        set -euo pipefail
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev

    # Use pwsh so GITHUB_PATH gets real Windows paths (go-task LookPath needs them).
    - name: Install Windows NSIS
      if: runner.os == 'Windows' && inputs.install-nsis == 'true'
      shell: pwsh
      run: |
        choco install nsis -y --no-progress
        $nsisDirs = @(
          "C:\Program Files (x86)\NSIS",
          "C:\Program Files\NSIS",
          "C:\ProgramData\chocolatey\bin"
        )
        foreach ($dir in $nsisDirs) {
          if (Test-Path $dir) {
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            Write-Host "Added to PATH: $dir"
          }
        }
        $makensis = Get-Command makensis -ErrorAction SilentlyContinue
        if (-not $makensis) {
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
        }
        # Refresh PATH for this step from candidates
        $env:Path = ($nsisDirs + $env:Path) -join ';'
        & makensis -VERSION

    - name: Cache frontend dependencies
      if: inputs.install-frontend == 'true'
      uses: actions/cache@v4
      with:
        path: |
          frontend/node_modules
          ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install frontend dependencies
      if: inputs.install-frontend == 'true'
      shell: bash
      working-directory: frontend
      run: bun install --frozen-lockfile
