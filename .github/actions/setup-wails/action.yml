name: Setup Wails
description: >
  Install toolchain for official wails3 build/package.
  Mirrors https://v3.wails.io/guides/build/cross-platform/#cicd-integration
  with project-specific bun + Linux GTK + pinned Wails.

inputs:
  wails-version:
    description: Wails CLI version (pin to go.mod when possible)
    required: true
  bun-version:
    required: false
    default: "1.3.11"
  # release/package needs NSIS on Windows; build-only can skip.
  with-nsis:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    - name: Install Wails CLI
      shell: bash
      env:
        CGO_ENABLED: "0"
      run: |
        set -euo pipefail
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    # Required for Linux desktop builds (official sample often omits this).
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    # Only for wails3 package on Windows (NSIS installer).
    - name: Install NSIS (Windows package only)
      if: runner.os == 'Windows' && inputs.with-nsis == 'true'
      shell: pwsh
      run: |
        choco install nsis -y --no-progress
        foreach ($dir in @(
          "C:\Program Files (x86)\NSIS",
          "C:\Program Files\NSIS",
          "C:\ProgramData\chocolatey\bin"
        )) {
          if (Test-Path $dir) { Add-Content -Path $env:GITHUB_PATH -Value $dir }
        }
        $env:Path = "C:\Program Files (x86)\NSIS;C:\ProgramData\chocolatey\bin;" + $env:Path
        makensis -VERSION

    - name: Install frontend deps
      shell: bash
      working-directory: frontend
      run: bun install --frozen-lockfile
