# Official release on v* tags. Tag core must match build/config.yml info.version.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Empty = use config.yml.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: wood-hot-monitor
  WAILS_VERSION: v3.0.0-alpha2.110

jobs:
  resolve-version:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      git_commit: ${{ steps.meta.outputs.git_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_VERSION="$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml | head -n1)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v${CONFIG_VERSION}"
          fi

          VERSION="${RAW_TAG#v}"
          CONFIG_CORE="$(echo "${CONFIG_VERSION}" | sed -E 's/[-+].*$//')"
          TAG_CORE="$(echo "${VERSION}" | sed -E 's/[-+].*$//')"
          if [[ "${CONFIG_CORE}" != "${TAG_CORE}" ]]; then
            echo "Tag v${VERSION} does not match build/config.yml info.version=${CONFIG_VERSION}" >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "git_commit=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "release tag=v${VERSION} commit=${SHORT_SHA}"

  # Single refresh of packaging metadata from config.yml (official Wails).
  prepare-assets:
    name: Sync build assets
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-wails
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          install-frontend: "false"
          install-nsis: "false"
      - name: wails3 task assets:sync
        shell: bash
        run: wails3 task assets:sync
      - uses: actions/upload-artifact@v4
        with:
          name: synced-build-assets
          path: build/**
          if-no-files-found: error
          retention-days: 1

  package:
    name: ${{ matrix.name }}
    needs: [resolve-version, prepare-assets]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            goos: darwin
            artifact: wood-hot-monitor-darwin-arm64
          - name: Linux
            os: ubuntu-latest
            goos: linux
            artifact: wood-hot-monitor-linux-amd64
          - name: Windows
            os: windows-latest
            goos: windows
            artifact: wood-hot-monitor-windows-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Restore synced packaging metadata
        uses: actions/download-artifact@v4
        with:
          name: synced-build-assets
          path: build

      - uses: ./.github/actions/setup-wails
        with:
          wails-version: ${{ env.WAILS_VERSION }}

      - uses: ./.github/actions/package-app
        with:
          app-name: ${{ env.APP_NAME }}
          goos: ${{ matrix.goos }}
          artifact-base: ${{ matrix.artifact }}-${{ needs.resolve-version.outputs.tag }}
          app-version: ${{ needs.resolve-version.outputs.version }}
          git-commit: ${{ needs.resolve-version.outputs.git_commit }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub Release
    needs: [resolve-version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: find release-assets -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Wood Hot Monitor ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve-version.outputs.version, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
