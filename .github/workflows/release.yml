# Official multi-platform release on version tags.
# You own the version text in build/config.yml (info.version).
# Tag must match that value, e.g. config 0.2.0  =>  git tag v0.2.0
# CI integrates: validate, wails3 update build-assets, package, GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Empty = use config.yml version.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: wood-hot-monitor
  WAILS_VERSION: v3.0.0-alpha2.110

jobs:
  resolve-version:
    name: Validate tag vs config.yml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      git_commit: ${{ steps.meta.outputs.git_commit }}
      build_number: ${{ steps.meta.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_VERSION="$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml | head -n1)"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RAW_TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG="v${CONFIG_VERSION}"
          fi

          TAG="${RAW_TAG}"
          VERSION="${TAG#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid tag/version: ${TAG}" >&2
            exit 1
          fi

          CONFIG_CORE="$(echo "${CONFIG_VERSION}" | sed -E 's/[-+].*$//')"
          TAG_CORE="$(echo "${VERSION}" | sed -E 's/[-+].*$//')"
          if [[ "${CONFIG_CORE}" != "${TAG_CORE}" ]]; then
            echo "Tag ${TAG} does not match build/config.yml info.version=${CONFIG_VERSION}" >&2
            echo "Update build/config.yml (and commit) before tagging." >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "git_commit=${SHORT_SHA}"
            echo "build_number=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

          echo "Release ${TAG} (config.yml=${CONFIG_VERSION}, commit=${SHORT_SHA})"

  package:
    name: ${{ matrix.name }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: wood-hot-monitor-darwin-arm64
          - name: Linux
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: wood-hot-monitor-linux-amd64
          - name: Windows
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: wood-hot-monitor-windows-amd64

    env:
      APP_VERSION: ${{ needs.resolve-version.outputs.version }}
      GIT_COMMIT: ${{ needs.resolve-version.outputs.git_commit }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails CLI
        shell: bash
        env:
          # CLI install must not require GTK/WebKit headers (Linux runners).
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wails3 version || true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install nsis -y --no-progress
          NSIS_DIR="/c/Program Files (x86)/NSIS"
          # Same-step PATH (GITHUB_PATH only affects subsequent steps).
          export PATH="${NSIS_DIR}:${PATH}"
          # Later steps (package) need this too.
          echo "${NSIS_DIR}" >> "$GITHUB_PATH"
          # Chocolatey shim dir sometimes used instead of Program Files.
          if [[ -x "/c/ProgramData/chocolatey/bin/makensis.exe" ]]; then
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
            export PATH="/c/ProgramData/chocolatey/bin:${PATH}"
          fi
          command -v makensis
          makensis -VERSION

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Sync packaging assets from config.yml (Wails official)
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"

          wails3 update build-assets \
            -config ./build/config.yml \
            -dir ./build \
            -name "${APP_NAME}" \
            -binaryname "${APP_NAME}" \
            -productversion "${APP_VERSION}" \
            -silent

          nfpm="build/linux/nfpm/nfpm.yaml"
          if [[ -f "$nfpm" ]]; then
            sed -i.bak \
              -e 's|^homepage:.*|homepage: "https://github.com/asmu1n/wood-hot-monitor"|' \
              -e 's|^license:.*|license: "GPL-3.0"|' \
              -e 's|^maintainer:.*|maintainer: "asmu1n <asmu1n@users.noreply.github.com>"|' \
              "$nfpm"
            rm -f "${nfpm}.bak"
          fi

          # Stock Wails nfpm template references optional scripts that we do not ship.
          if [[ -f "$nfpm" ]] && grep -q '^scripts:' "$nfpm"; then
            # Drop the scripts: block through the next top-level comment/blank section start.
            awk '
              BEGIN {skip=0}
              /^scripts:/ {skip=1; next}
              skip && /^[^[:space:]#]/ {skip=0}
              skip && /^# / {skip=0}
              !skip {print}
            ' "$nfpm" > "${nfpm}.tmp" && mv "${nfpm}.tmp" "$nfpm"
          fi

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist bin
          TAG="${{ needs.resolve-version.outputs.tag }}"
          ARTIFACT_BASE="${{ matrix.artifact }}-${TAG}"

          case "${{ matrix.goos }}" in
            darwin)
              wails3 task package
              test -d "bin/${APP_NAME}.app"
              (cd bin && ditto -c -k --keepParent "${APP_NAME}.app" "../dist/${ARTIFACT_BASE}.app.zip")
              ;;
            linux)
              wails3 task build
              test -x "bin/${APP_NAME}"
              wails3 task linux:generate:dotdesktop
              wails3 task linux:generate:deb
              tar -C bin -czf "dist/${ARTIFACT_BASE}.tar.gz" "${APP_NAME}"
              shopt -s nullglob
              deb_files=(bin/*.deb)
              cp "${deb_files[0]}" "dist/${ARTIFACT_BASE}.deb"
              ;;
            windows)
              wails3 task package
              test -f "bin/${APP_NAME}.exe"
              shopt -s nullglob
              installer_files=(bin/*installer*.exe)
              cp "${installer_files[0]}" "dist/${ARTIFACT_BASE}-installer.exe"
              (cd bin && zip -9 "../dist/${ARTIFACT_BASE}.zip" "${APP_NAME}.exe")
              ;;
          esac

          ls -lah dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub Release
    needs: [resolve-version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - run: find release-assets -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Wood Hot Monitor ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve-version.outputs.version, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
