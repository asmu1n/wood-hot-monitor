# Package-level CI (installers), triggered by version tags.
#
# How to release:
#   1) Set build/config.yml → info.version (e.g. 0.3.0)
#   2) Optional locally: wails3 task assets:sync && commit build/
#   3) git tag v0.3.0 && git push origin v0.3.0
#
# Flow per platform (same as local):
#   setup → wails3 package (linux/windows) | darwin:package:dmg (macOS) → upload installers → GitHub Release
#
# Commands are the official Wails ones; this file only schedules them on runners.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). Empty = config.yml version.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-alpha2.122
  APP_NAME: wood-hot-monitor

jobs:
  validate:
    name: Validate tag ↔ config.yml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml | head -n1)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${CONFIG}"
          fi
          VER="${TAG#v}"
          CORE_CFG="$(echo "$CONFIG" | sed -E 's/[-+].*$//')"
          CORE_TAG="$(echo "$VER" | sed -E 's/[-+].*$//')"
          if [[ "$CORE_CFG" != "$CORE_TAG" ]]; then
            echo "Tag $TAG does not match build/config.yml info.version=$CONFIG" >&2
            echo "Update config.yml, commit, then tag." >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "OK tag=v$VER config=$CONFIG"

  package:
    name: package-${{ matrix.goos }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup (incl. NSIS on Windows)
        uses: ./.github/actions/setup-wails
        with:
          wails-version: ${{ env.WAILS_VERSION }}
          with-nsis: "true"

      # Keep packaging metadata in sync with config.yml (official Wails tool).
      - name: Sync build assets from config.yml
        shell: bash
        run: wails3 task assets:sync

      - name: Package (official Wails)
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GIT_COMMIT="$(echo "${GIT_COMMIT}" | cut -c1-7)"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          case "${{ matrix.goos }}" in
            darwin)
              # Official macOS installer flow:
              #   https://v3.wails.io/guides/build/macos/#dmg-installer
              # package:dmg => .app bundle + styled DMG via `wails3 tool package --format dmg`
              echo "wails3 task darwin:package:dmg"
              wails3 task darwin:package:dmg
              ;;
            windows)
              # Official Windows package uses NSIS (makensis on PATH from setup-wails).
              # Ensure common install locations are on PATH for this step too.
              for d in \
                "/c/Program Files (x86)/NSIS" \
                "/c/Program Files/NSIS" \
                "/c/ProgramData/chocolatey/bin"
              do
                [[ -d "$d" ]] && export PATH="$d:$PATH"
              done
              command -v makensis
              makensis -VERSION || true
              echo "wails3 package"
              wails3 package
              ;;
            linux)
              # Official Linux package: AppImage + deb/rpm/arch via nfpm / wails3 tool package
              echo "wails3 package"
              wails3 package
              ;;
            *)
              echo "unknown goos=${{ matrix.goos }}" >&2
              exit 1
              ;;
          esac

          echo "=== bin/ ==="
          ls -lah bin/ || ls -la bin/

      - name: Verify macOS DMG
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== bin/ (darwin) ==="
          ls -lah bin/
          shopt -s nullglob
          dmgs=(bin/*.dmg)
          if [[ ${#dmgs[@]} -lt 1 ]]; then
            echo "Expected at least one .dmg in bin/ after darwin:package:dmg" >&2
            exit 1
          fi
          for d in "${dmgs[@]}"; do ls -lah "$d"; done

      # Upload installers/binaries only. Do NOT upload .app trees — GitHub Releases
      # flatten nested files and previously produced broken macOS assets.
      - name: Prepare release-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          goos="${{ matrix.goos }}"
          shopt -s nullglob
          case "$goos" in
            darwin)
              # Official tool writes bin/<APP_NAME>.dmg; publish a versioned filename.
              shopt -s nullglob
              dmgs=(bin/*.dmg)
              if [[ ${#dmgs[@]} -lt 1 ]]; then
                echo "no .dmg produced" >&2
                exit 1
              fi
              ver="${{ needs.validate.outputs.version }}"
              for d in "${dmgs[@]}"; do
                base="$(basename "$d" .dmg)"
                # wood-hot-monitor.dmg -> wood-hot-monitor-0.2.0-darwin.dmg
                out="release-dist/${base}-${ver}-darwin.dmg"
                cp -v "$d" "$out"
              done
              ;;
            linux)
              for f in bin/*.deb bin/*.rpm bin/*.AppImage bin/*.pkg.tar.zst bin/${{ env.APP_NAME }}; do
                [[ -f "$f" ]] && cp -v "$f" release-dist/
              done
              ;;
            windows)
              for f in bin/*.exe; do
                [[ -f "$f" ]] && cp -v "$f" release-dist/
              done
              ;;
            *)
              echo "unknown goos=$goos" >&2
              exit 1
              ;;
          esac
          echo "=== release-dist/ ==="
          ls -lah release-dist/
          # Fail if empty
          test -n "$(find release-dist -type f | head -n1)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: false

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # release-assets/package-linux/*, package-darwin/*, package-windows/*
          # Artifacts are already filtered to installers (see Prepare release-dist).
          find release-assets -type f ! -name '*.txt' ! -name '.DS_Store' | sort | while read -r f; do
            # Never publish loose files from inside a .app bundle.
            case "$f" in
              *.app/*|*.app\\*) continue ;;
            esac
            base="$(basename "$f")"
            # Installer-style names are unique enough — keep basename.
            case "$base" in
              *.dmg|*.deb|*.rpm|*.AppImage|*.pkg.tar.zst|*installer.exe|*setup.exe)
                dest="out/${base}"
                ;;
              *)
                plat="$(basename "$(dirname "$f")")"
                dest="out/${plat}-${base}"
                ;;
            esac
            if [[ -e "$dest" ]]; then
              echo "collision: $dest (from $f)" >&2
              exit 1
            fi
            cp "$f" "$dest"
          done
          echo "=== out/ ==="
          ls -lah out
          test -n "$(find out -type f | head -n1)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Wood Hot Monitor ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
