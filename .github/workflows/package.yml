# PR / main preview builds. Version text lives in build/config.yml (info.version).
# Packaging metadata in build/ is trusted as committed; CI does not rewrite it.
name: Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: wood-hot-monitor
  WAILS_VERSION: v3.0.0-alpha2.110

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      marketing_version: ${{ steps.meta.outputs.marketing_version }}
      version: ${{ steps.meta.outputs.version }}
      artifact_tag: ${{ steps.meta.outputs.artifact_tag }}
      git_commit: ${{ steps.meta.outputs.git_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          MARKETING="$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' build/config.yml | head -n1)"
          if [[ -z "${MARKETING}" ]]; then
            echo "build/config.yml info.version is empty" >&2
            exit 1
          fi
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="${MARKETING}-pr.${{ github.event.pull_request.number }}+${SHORT_SHA}"
            ARTIFACT_TAG="v${MARKETING}-pr${{ github.event.pull_request.number }}-${SHORT_SHA}"
          else
            VERSION="${MARKETING}+${SHORT_SHA}"
            ARTIFACT_TAG="v${MARKETING}-${SHORT_SHA}"
          fi
          {
            echo "marketing_version=${MARKETING}"
            echo "version=${VERSION}"
            echo "artifact_tag=${ARTIFACT_TAG}"
            echo "git_commit=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "config.yml=${MARKETING}  build_id=${VERSION}"

  package:
    name: ${{ matrix.name }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            goos: darwin
            artifact: wood-hot-monitor-darwin-arm64
          - name: Linux
            os: ubuntu-latest
            goos: linux
            artifact: wood-hot-monitor-linux-amd64
          - name: Windows
            os: windows-latest
            goos: windows
            artifact: wood-hot-monitor-windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wails
        with:
          wails-version: ${{ env.WAILS_VERSION }}

      - uses: ./.github/actions/package-app
        with:
          app-name: ${{ env.APP_NAME }}
          goos: ${{ matrix.goos }}
          artifact-base: ${{ matrix.artifact }}-${{ needs.resolve-version.outputs.artifact_tag }}
          app-version: ${{ needs.resolve-version.outputs.version }}
          git-commit: ${{ needs.resolve-version.outputs.git_commit }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
